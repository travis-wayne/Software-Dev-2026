<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Lesson 1</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --text-color: #e2e8f0;
            --primary: #10b981;
            --secondary: #8b5cf6;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: rgba(11, 17, 32, 0.8);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            color: var(--primary);
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 1.5rem;
        }

        nav a:hover { color: var(--secondary); }

        main {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }

        a.btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background-color: var(--primary);
            color: #0b1120;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>About the Project</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h2>Multi-Page Websites!</h2>
            <p>This is the About page. You navigated here using a relative HTML anchor link.</p>
            <p>Notice how easy it is to link multiple HTML files together to create a cohesive website.</p>
            <a href="index.html" class="btn">Back to Home</a>
        </div>
    </main>

</body>
</html>
