version: '3.8'
services:
  gateway:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && node src/gateway.js"
    ports:
      - "3009:3009"
    environment:
      - USER_SERVICE_URL=http://user-service:3010
      - PRODUCT_SERVICE_URL=http://product-service:3011
      - ORDER_SERVICE_URL=http://order-service:3012
    depends_on:
      - user-service
      - product-service
      - order-service

  user-service:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && node src/user-service.js"
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      # - DATABASE_URL=postgresql://...neon.tech/neondb  # Uncomment for Neon

  product-service:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && node src/product-service.js"
    ports:
      - "3011:3011"
    environment:
      - PORT=3011

  order-service:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && node src/order-service.js"
    ports:
      - "3012:3012"
    environment:
      - PORT=3012
      - USER_SERVICE_URL=http://user-service:3010
      - PRODUCT_SERVICE_URL=http://product-service:3011
