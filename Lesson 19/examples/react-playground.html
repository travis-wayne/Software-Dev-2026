<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Playground | Lesson 19</title>
    <!-- Load React, ReactDOM, and Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #f8fafc;
            --primary: #3b82f6; --muted: #94a3b8;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: 2rem; margin: 0; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        h1 { margin-top: 0; font-size: 1.5rem; }
        .subtitle { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
        .workspace { display: flex; gap: 1.5rem; flex: 1; min-height: 0; }
        .editor-pane, .preview-pane { flex: 1; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .pane-header { background: #000; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .pane-header button { background: var(--primary); color: white; border: none; padding: 0.4rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .pane-header button:hover { filter: brightness(1.1); }
        textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; padding: 1rem; border: none; resize: none; outline: none; line-height: 1.5; tab-size: 4; }
        #preview-root { flex: 1; padding: 1.5rem; background: white; color: black; overflow-y: auto; }
        #error-overlay { display: none; background: #fef2f2; color: #991b1b; padding: 1rem; font-family: monospace; border-top: 1px solid #f87171; overflow-x: auto; white-space: pre-wrap; font-size: 0.85rem; }
        
        /* Styles that the React components can use */
        .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .btn { background: #2563eb; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        .btn-outline { background: transparent; color: #2563eb; border: 1px solid #2563eb; }
        .flex { display: flex; gap: 1rem; }
    </style>
</head>
<body>

    <h1>⚛️ Zero-Build React Playground</h1>
    <p class="subtitle">Write React components and JSX on the left, click "Run Code", and see the result on the right. No build step required.</p>

    <div class="workspace">
        <div class="editor-pane">
            <div class="pane-header">
                <span>Code (JSX)</span>
                <button onclick="compileAndRun()">▶ Run Code</button>
            </div>
            <textarea id="code-editor" spellcheck="false">
// 1. A simple reusable Component
function Button({ text, type = "primary" }) {
    const className = type === "primary" ? "btn" : "btn btn-outline";
    return (
        <button className={className}>
            {text}
        </button>
    );
}

// 2. A Component that takes props and uses other components
function UserCard(props) {
    return (
        <div className="card">
            <h2 style={{ marginTop: 0 }}>{props.name}</h2>
            <p>Role: {props.role}</p>
            <div className="flex">
                <Button text="Follow" />
                <Button text="Message" type="outline" />
            </div>
        </div>
    );
}

// 3. The main App Component
function App() {
    return (
        <div>
            <h1>Team Members</h1>
            {/* Notice how easy it is to reuse the Lego blocks! */}
            <UserCard name="Alice Johnson" role="Lead Developer" />
            <UserCard name="Bob Smith" role="UI Designer" />
        </div>
    );
}

// 4. Render the App to the screen
const root = ReactDOM.createRoot(document.getElementById('preview-root'));
root.render(<App />);
            </textarea>
        </div>

        <div class="preview-pane">
            <div class="pane-header" style="background: #f1f5f9; color: #334155; border-bottom-color: #cbd5e1;">
                Live Preview
            </div>
            <div id="preview-root"></div>
            <div id="error-overlay"></div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('code-editor');
        const errorOverlay = document.getElementById('error-overlay');
        const previewRoot = document.getElementById('preview-root');

        // Simple tab support in textarea
        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });

        function compileAndRun() {
            const code = editor.value;
            errorOverlay.style.display = 'none';
            errorOverlay.textContent = '';
            
            try {
                // Use Babel to transpile JSX to JS in the browser
                const transpiled = Babel.transform(code, { presets: ['react'] }).code;
                
                // Execute the transpiled code
                // We use a new Function to avoid polluting the global scope, 
                // but we pass in React and ReactDOM so the code can use them.
                const execute = new Function('React', 'ReactDOM', transpiled);
                execute(React, ReactDOM);
                
            } catch (err) {
                // Show syntax or compilation errors
                previewRoot.innerHTML = '';
                errorOverlay.textContent = err.toString();
                errorOverlay.style.display = 'block';
            }
        }

        // Run initially
        setTimeout(compileAndRun, 500);
    </script>
</body>
</html>
