<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Lesson 18: Algorithms</title>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--primary:#f59e0b;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem;}
.container{max-width:760px;margin:0 auto;}
h1{font-size:1.7rem;margin-bottom:.3rem;}
.subtitle{color:var(--muted);margin-bottom:2rem;font-size:.92rem;}
.progress-bar{background:var(--border);border-radius:999px;height:6px;margin-bottom:2rem;overflow:hidden;}
.progress-fill{background:var(--primary);height:100%;border-radius:999px;transition:width .4s;}
.progress-label{font-size:.8rem;color:var(--muted);margin-bottom:.5rem;}
.question-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.75rem;margin-bottom:1.25rem;display:none;animation:fadeIn .25s;}
.question-card.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section-badge{display:inline-block;background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:.2rem .75rem;font-size:.75rem;font-weight:600;margin-bottom:.75rem;}
.q-number{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.6rem;}
.q-text{font-size:1.02rem;line-height:1.65;margin-bottom:1.25rem;}
pre.q-code{background:#000;border:1px solid var(--border);border-radius:6px;padding:1rem;font-family:'Consolas','Courier New',monospace;font-size:.82rem;color:#a5b4fc;margin-bottom:1.25rem;overflow-x:auto;white-space:pre;}
.trace-box{background:#000;border:1px solid var(--border);border-radius:8px;padding:1.25rem;margin-bottom:1.25rem;overflow-x:auto;}
.trace-input{background:#1e293b;border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'Consolas','Courier New',monospace;font-size:.82rem;padding:.3rem .5rem;width:180px;text-align:center;}
.trace-input.correct-input{border-color:var(--success);color:var(--success);}
.trace-input.wrong-input{border-color:var(--danger);color:var(--danger);}
.options{display:flex;flex-direction:column;gap:.6rem;}
.option{background:#0f172a;border:2px solid var(--border);border-radius:8px;padding:.75rem 1rem;cursor:pointer;display:flex;align-items:flex-start;gap:.75rem;transition:border-color .15s,background .15s;font-size:.95rem;line-height:1.5;}
.option:hover{border-color:var(--primary);background:rgba(245,158,11,.07);}
.option.selected{border-color:var(--primary);background:rgba(245,158,11,.1);}
.option.correct{border-color:var(--success)!important;background:rgba(16,185,129,.1)!important;}
.option.wrong{border-color:var(--danger)!important;background:rgba(239,68,68,.08)!important;}
.option-key{font-weight:700;color:var(--muted);flex-shrink:0;min-width:18px;}
.option.selected .option-key{color:var(--primary);}
.option.correct .option-key{color:var(--success);}
.option.wrong   .option-key{color:var(--danger);}
.explanation{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:6px;padding:.8rem 1rem;margin-top:1rem;font-size:.88rem;color:#fcd34d;display:none;line-height:1.65;}
.explanation.show{display:block;}
.btn-row{display:flex;gap:.75rem;margin-top:1.5rem;flex-wrap:wrap;}
button{padding:.55rem 1.3rem;border-radius:7px;border:none;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit;transition:filter .15s;}
.btn-primary{background:var(--primary);color:#000;}
.btn-success{background:var(--success);color:#fff;}
.btn-muted{background:#334155;color:var(--text);}
button:hover{filter:brightness(1.1);}
button:disabled{opacity:.45;cursor:not-allowed;}
#results{display:none;text-align:center;padding:2.5rem 1rem;}
.score-ring{width:140px;height:140px;border-radius:50%;border:6px solid var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto 1.5rem;font-size:2.2rem;font-weight:700;}
.score-ring.great{border-color:var(--success);color:var(--success);}
.score-ring.ok{border-color:var(--warning);color:var(--warning);}
.score-ring.poor{border-color:var(--danger);color:var(--danger);}
.score-msg{font-size:1.1rem;margin-bottom:.5rem;}
.score-sub{color:var(--muted);font-size:.9rem;margin-bottom:2rem;}
.review-list{text-align:left;margin-top:1.5rem;}
.review-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:.75rem;}
.review-item.r-correct{border-left:3px solid var(--success);}
.review-item.r-wrong{border-left:3px solid var(--danger);}
.review-q{font-size:.88rem;margin-bottom:.35rem;}
.review-a{font-size:.85rem;color:var(--muted);}
.right{color:var(--success);font-weight:600;}
.wrong{color:var(--danger);font-weight:600;}
</style>
</head>
<body>
<div class="container">
  <h1>🔍 Quiz — Lesson 18</h1>
  <p class="subtitle">Algorithms: Sorting & Searching · 12 questions (10 MC + 2 trace)</p>

  <p class="progress-label" id="prog-label">Question 1 of 12</p>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:8.3%"></div></div>

  <div id="quiz-area"></div>
  <div id="results"></div>
</div>

<script>
const Q=[
  {type:'mc',section:'Multiple Choice',q:"What is the worst-case Big O of Linear Search on an array of n items?",
   options:["O(1)","O(log n)","O(n)","O(n²)"],answer:2,
   explanation:"Worst case: the target is at the very end or not present at all — every element must be checked. That's n checks for n items → O(n)."},
  {type:'mc',section:'Multiple Choice',q:"What is the strict requirement for Binary Search to work correctly?",
   options:["The array must contain only numbers","The array must be sorted in ascending order","The array must have no duplicates","The array must have fewer than 1,000 elements"],answer:1,
   explanation:"Binary Search eliminates half the remaining elements each step by comparing the middle value. This only works if the data is sorted — on unsorted data, the algorithm may eliminate the half that actually contains the target."},
  {type:'mc',section:'Multiple Choice',q:"You run Binary Search on a sorted array of 1,000,000 items. Approximately how many comparisons in the worst case?",
   options:["1,000,000","500,000","1,000","20"],answer:3,
   explanation:"log₂(1,000,000) ≈ 20. Binary Search halves the search space each step, so it needs at most ~20 comparisons regardless of whether the array has a million items."},
  {type:'mc',section:'Multiple Choice',q:"In Bubble Sort, what is guaranteed after one complete pass through the array?",
   options:["The entire array is sorted","The smallest element is at the front","The largest element is in its final position at the end","All adjacent elements are in order"],answer:2,
   explanation:"The heaviest (largest) element 'bubbles up' to the end during the first pass, through repeated adjacent swaps. After pass 1, the last position is guaranteed correct."},
  {type:'mc',section:'Multiple Choice',q:"What is the worst-case Big O of Bubble Sort?",
   options:["O(n)","O(n log n)","O(n²)","O(log n)"],answer:2,
   explanation:"Bubble Sort compares every pair in every pass. For n items it does roughly n passes of n comparisons each → O(n²). This occurs on a fully reverse-sorted array."},
  {type:'mc',section:'Multiple Choice',q:"In Selection Sort, what happens at the end of each outer loop iteration?",
   options:["The largest unsorted element is swapped to the back","Adjacent pairs are compared and swapped","The minimum unsorted element is placed at the start of the unsorted portion","The array is split in half"],answer:2,
   explanation:"Selection Sort scans the unsorted portion, finds its minimum value, and swaps it to the front of the unsorted section. This is why it makes at most n-1 swaps total."},
  {type:'mc',section:'Multiple Choice',q:"What is the best-case Big O of optimised Bubble Sort (with a swapped flag)?",
   options:["O(n²)","O(n log n)","O(log n)","O(n) — one pass detects no swaps and exits"],answer:3,
   explanation:"With the swapped flag: if the array is already sorted, the first pass makes zero swaps. The flag detects this and exits after just one pass → O(n). Without the flag, Bubble Sort always runs O(n²) even on sorted data."},
  {type:'mc',section:'Multiple Choice',q:"You run arr.sort() without a comparator on [100, 20, 3]. What is the result?",
   options:["[3, 20, 100]","[100, 20, 3]","[100, 20, 3] — sorted lexicographically as strings","An error is thrown"],answer:2,
   explanation:"Without a comparator, JavaScript converts numbers to strings and sorts alphabetically. '100' < '20' < '3' because '1' < '2' < '3' in Unicode order. This is a very common bug!"},
  {type:'mc',section:'Multiple Choice',q:"Which algorithm makes the fewest swaps for the same input?",
   options:["Bubble Sort — swaps adjacent pairs throughout","Selection Sort — swaps at most once per outer pass","They always make the same number","Linear Search"],answer:1,
   explanation:"Selection Sort identifies the minimum value first, then makes exactly one swap per pass. Bubble Sort swaps every out-of-order adjacent pair it encounters — potentially many per pass."},
  {type:'mc',section:'Multiple Choice',q:"Your friend suggests using Binary Search on an unsorted array. What is the problem?",
   options:["Binary Search only works on strings","Binary Search eliminates halves assuming sorted order — it may eliminate the half containing the target","Binary Search is slower than Linear Search","There is no problem"],answer:1,
   explanation:"Binary Search looks at the middle element and discards one half based on the comparison. On unsorted data, the target could be in the discarded half, so the algorithm returns -1 (not found) even when the item exists."},
  {type:'trace',section:'Bubble Sort Trace',q:"Trace Pass 1 of Bubble Sort on [6, 3, 8, 2]. Fill in what happens at each comparison step.",
   traceOps:[
     {op:"Compare arr[0]=6 vs arr[1]=3", swapAns:"Yes", arrAns:"[3, 6, 8, 2]"},
     {op:"Compare arr[1]=6 vs arr[2]=8", swapAns:"No",  arrAns:"[3, 6, 8, 2]"},
     {op:"Compare arr[2]=8 vs arr[3]=2", swapAns:"Yes", arrAns:"[3, 6, 2, 8]"},
   ],
   finalAns:"8",
   explanation:"8 is the largest element — it 'bubbles' to the end of the array during Pass 1, so it is guaranteed to be in its correct final position."},
  {type:'trace',section:'Binary Search Trace',q:"Trace Binary Search for target 35 in [10, 20, 25, 30, 35, 40, 50]. Fill in the missing values.",
   bsOps:[
     {step:"1",leftAns:"0",rightAns:"6",midAns:"3",midValAns:"30",actionAns:"35 > 30 → move left to 4"},
     {step:"2",leftAns:"4",rightAns:"6",midAns:"5",midValAns:"40",actionAns:"35 < 40 → move right to 4"},
     {step:"3",leftAns:"4",rightAns:"4",midAns:"4",midValAns:"35",actionAns:"Found! Return index 4"},
   ],
   explanation:"Binary Search found 35 in only 3 comparisons. Linear Search would need up to 5 comparisons (checking 10, 20, 25, 30, 35 in order). This demonstrates O(log n) vs O(n)."},
];

let current=0,score=0,selected=[],checked=[];

function buildQuiz(){
  const area=document.getElementById('quiz-area');area.innerHTML='';
  Q.forEach((q,i)=>{
    const card=document.createElement('div');
    card.className='question-card'+(i===0?' active':'');card.id='q'+i;
    let inner=`<div class="section-badge">${q.section}</div>`;
    inner+=`<div class="q-number">Question ${i+1} of ${Q.length}</div>`;
    inner+=`<div class="q-text">${q.q}</div>`;
    if(q.code) inner+=`<pre class="q-code">${escHtml(q.code)}</pre>`;
    if(q.type==='mc'){
      inner+=`<div class="options">${q.options.map((o,oi)=>`<div class="option" id="opt-${i}-${oi}" onclick="selectOpt(${i},${oi})"><span class="option-key">${'ABCD'[oi]}</span><span>${o}</span></div>`).join('')}</div>`;
    } else if(q.type==='trace' && q.traceOps){
      inner+=`<div class="trace-box"><table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <tr style="color:#475569;border-bottom:1px solid #334155;"><th style="text-align:left;padding:.4rem .5rem">Step</th><th style="padding:.4rem">Swap?</th><th style="padding:.4rem">Array after</th></tr>`;
      q.traceOps.forEach((row,ri)=>{
        inner+=`<tr style="border-bottom:1px solid #1e293b;">
          <td style="padding:.5rem;color:#93c5fd;font-size:.8rem">${row.op}</td>
          <td style="padding:.5rem;text-align:center"><input class="trace-input" id="ti-${i}-${ri}-0" placeholder="Yes / No" style="width:90px"/></td>
          <td style="padding:.5rem;text-align:center"><input class="trace-input" id="ti-${i}-${ri}-1" placeholder="[?,?,?,?]"/></td>
        </tr>`;
      });
      inner+=`</table>
      <div style="margin-top:1rem;color:#475569;font-size:.82rem">After Pass 1, which element is guaranteed in its final position?
        <input class="trace-input" id="ti-${i}-final" placeholder="?" style="width:60px;margin-left:.5rem"/>
      </div></div>`;
    } else if(q.type==='trace' && q.bsOps){
      inner+=`<div class="trace-box"><table style="width:100%;border-collapse:collapse;font-size:.78rem;">
        <tr style="color:#475569;border-bottom:1px solid #334155;">
          <th style="padding:.3rem">Step</th><th style="padding:.3rem">left</th><th style="padding:.3rem">right</th><th style="padding:.3rem">mid</th><th style="padding:.3rem">arr[mid]</th><th style="padding:.3rem;text-align:left">Action</th>
        </tr>`;
      q.bsOps.forEach((row,ri)=>{
        inner+=`<tr style="border-bottom:1px solid #1e293b;">
          <td style="padding:.4rem;text-align:center;color:#93c5fd;font-weight:700">${row.step}</td>
          <td style="padding:.4rem;text-align:center"><input class="trace-input" id="bsi-${i}-${ri}-0" placeholder="?" style="width:55px"/></td>
          <td style="padding:.4rem;text-align:center"><input class="trace-input" id="bsi-${i}-${ri}-1" placeholder="?" style="width:55px"/></td>
          <td style="padding:.4rem;text-align:center"><input class="trace-input" id="bsi-${i}-${ri}-2" placeholder="?" style="width:55px"/></td>
          <td style="padding:.4rem;text-align:center"><input class="trace-input" id="bsi-${i}-${ri}-3" placeholder="?" style="width:55px"/></td>
          <td style="padding:.4rem"><input class="trace-input" id="bsi-${i}-${ri}-4" placeholder="explain..." style="width:100%;max-width:220px"/></td>
        </tr>`;
      });
      inner+=`</table></div>`;
    }
    inner+=`<div class="explanation" id="exp-${i}">${q.explanation}</div>`;
    inner+=`<div class="btn-row">
      <button class="btn-primary" id="check-${i}" onclick="checkAnswer(${i})" ${q.type==='mc'?'disabled':''}>Check Answer</button>
      ${i<Q.length-1?`<button class="btn-muted" id="next-${i}" onclick="nextQ(${i})" style="display:none">Next →</button>`
      :`<button class="btn-success" id="next-${i}" onclick="showResults()" style="display:none">See Results 🎉</button>`}
    </div>`;
    card.innerHTML=inner;area.appendChild(card);
  });
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function selectOpt(qi,oi){
  if(checked[qi])return;selected[qi]=oi;
  document.querySelectorAll(`[id^="opt-${qi}-"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
  document.getElementById(`check-${qi}`).disabled=false;
}

function checkAnswer(qi){
  if(checked[qi])return;checked[qi]=true;
  const q=Q[qi];
  if(q.type==='mc'){
    const c=q.answer,u=selected[qi];
    if(u===c) score++;
    document.querySelectorAll(`[id^="opt-${qi}-"]`).forEach((el,oi)=>{
      el.style.pointerEvents='none';
      if(oi===c) el.classList.add('correct');
      if(oi===u&&u!==c) el.classList.add('wrong');
    });
  } else if(q.type==='trace'&&q.traceOps){
    let ok=true;
    q.traceOps.forEach((row,ri)=>{
      const i0=document.getElementById(`ti-${qi}-${ri}-0`);
      const i1=document.getElementById(`ti-${qi}-${ri}-1`);
      [i0,i1].forEach(el=>el.disabled=true);
      const o0=i0.value.trim().toLowerCase()===row.swapAns.toLowerCase();
      const o1=i1.value.trim().replace(/\s/g,'')===row.arrAns.replace(/\s/g,'');
      i0.classList.add(o0?'correct-input':'wrong-input');
      i1.classList.add(o1?'correct-input':'wrong-input');
      if(!o0||!o1) ok=false;
    });
    const fin=document.getElementById(`ti-${qi}-final`);
    if(fin){fin.disabled=true;const fok=fin.value.trim()===q.finalAns;fin.classList.add(fok?'correct-input':'wrong-input');if(!fok)ok=false;}
    if(ok) score++;selected[qi]=ok?1:0;
  } else if(q.type==='trace'&&q.bsOps){
    let ok=true;
    q.bsOps.forEach((row,ri)=>{
      const fields=[row.leftAns,row.rightAns,row.midAns,row.midValAns,''];
      [0,1,2,3,4].forEach(fi=>{
        const el=document.getElementById(`bsi-${qi}-${ri}-${fi}`);
        if(!el)return;el.disabled=true;
        if(fi<4){const fok=el.value.trim()===fields[fi];el.classList.add(fok?'correct-input':'wrong-input');if(!fok)ok=false;}
        else{el.classList.add('correct-input');}// free-text action — no strict check
      });
    });
    if(ok) score++;selected[qi]=ok?1:0;
  }
  document.getElementById(`exp-${qi}`).classList.add('show');
  document.getElementById(`check-${qi}`).style.display='none';
  document.getElementById(`next-${qi}`).style.display='inline-block';
}

function nextQ(qi){
  document.getElementById('q'+qi).classList.remove('active');current=qi+1;
  document.getElementById('q'+current).classList.add('active');updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateProgress(){
  document.getElementById('prog-fill').style.width=((current+1)/Q.length*100)+'%';
  document.getElementById('prog-label').textContent=`Question ${current+1} of ${Q.length}`;
}
function showResults(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('prog-fill').style.width='100%';
  document.getElementById('prog-label').textContent='Complete!';
  const pct=Math.round(score/Q.length*100);
  const cls=pct>=80?'great':pct>=50?'ok':'poor';
  const msgs={great:'Algorithm master! 🎉',ok:'Good effort — revisit the sorting traces.',poor:'Keep practising — re-read the student notes.'};
  const items=Q.map((q,i)=>{
    const ok=q.type==='mc'?selected[i]===q.answer:selected[i]===1;
    return `<div class="review-item ${ok?'r-correct':'r-wrong'}">
      <div class="review-q">${i+1}. ${q.q.substring(0,80)}${q.q.length>80?'...':''}</div>
      <div class="review-a">${q.type==='mc'?
        `Your: <span class="${ok?'right':'wrong'}">${selected[i]!==undefined?`${'ABCD'[selected[i]]}) ${q.options[selected[i]]}`:'Not answered'}</span>${!ok?` — Correct: <span class="right">${'ABCD'[q.answer]}) ${q.options[q.answer]}</span>`:''}`:
        `<span class="${ok?'right':'wrong'}">${ok?'✅ Trace correct':'❌ Check the highlighted inputs'}</span>`}
      </div></div>`;
  }).join('');
  document.getElementById('results').innerHTML=`
    <div class="score-ring ${cls}"><span>${score}/${Q.length}</span><span style="font-size:.9rem;margin-top:.1rem">${pct}%</span></div>
    <div class="score-msg">${msgs[cls]}</div>
    <div class="score-sub">Lesson 18 — Algorithms: Sorting & Searching</div>
    <button class="btn-primary" onclick="restartQuiz()">↩ Retake Quiz</button>
    <div class="review-list">${items}</div>`;
  document.getElementById('results').style.display='block';
}
function restartQuiz(){current=0;score=0;selected=[];checked=[];document.getElementById('results').style.display='none';document.getElementById('quiz-area').style.display='block';updateProgress();buildQuiz();}
buildQuiz();
</script>
</body>
</html>
