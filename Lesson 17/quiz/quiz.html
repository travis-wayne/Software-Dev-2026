<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Lesson 17: Basic Data Structures</title>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--primary:#a855f7;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem;}
.container{max-width:760px;margin:0 auto;}
h1{font-size:1.7rem;margin-bottom:.3rem;}
.subtitle{color:var(--muted);margin-bottom:2rem;font-size:.92rem;}
.progress-bar{background:var(--border);border-radius:999px;height:6px;margin-bottom:2rem;overflow:hidden;}
.progress-fill{background:var(--primary);height:100%;border-radius:999px;transition:width .4s;}
.progress-label{font-size:.8rem;color:var(--muted);margin-bottom:.5rem;}
.question-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.75rem;margin-bottom:1.25rem;display:none;animation:fadeIn .25s;}
.question-card.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q-number{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.6rem;}
.q-text{font-size:1.02rem;line-height:1.65;margin-bottom:1.25rem;}
.q-text code{background:#0f172a;color:#c4b5fd;padding:.1em .4em;border-radius:4px;font-family:'Consolas','Courier New',monospace;font-size:.9em;}
pre.q-code{background:#000;border:1px solid var(--border);border-radius:6px;padding:1rem;font-family:'Consolas','Courier New',monospace;font-size:.82rem;color:#a5b4fc;margin-bottom:1.25rem;overflow-x:auto;white-space:pre;}
/* Trace section */
.trace-box{background:#000;border:1px solid var(--border);border-radius:8px;padding:1.25rem;margin-bottom:1.25rem;font-family:'Consolas','Courier New',monospace;font-size:.85rem;color:#94a3b8;line-height:1.8;}
.trace-input{background:#1e293b;border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'Consolas','Courier New',monospace;font-size:.85rem;padding:.3rem .6rem;width:160px;text-align:center;}
.trace-input.correct-input{border-color:var(--success);color:var(--success);}
.trace-input.wrong-input{border-color:var(--danger);color:var(--danger);}
.options{display:flex;flex-direction:column;gap:.6rem;}
.option{background:#0f172a;border:2px solid var(--border);border-radius:8px;padding:.75rem 1rem;cursor:pointer;display:flex;align-items:flex-start;gap:.75rem;transition:border-color .15s,background .15s;font-size:.95rem;line-height:1.5;}
.option:hover{border-color:var(--primary);background:rgba(168,85,247,.07);}
.option.selected{border-color:var(--primary);background:rgba(168,85,247,.12);}
.option.correct{border-color:var(--success)!important;background:rgba(16,185,129,.1)!important;}
.option.wrong{border-color:var(--danger)!important;background:rgba(239,68,68,.08)!important;}
.option-key{font-weight:700;color:var(--muted);flex-shrink:0;min-width:18px;}
.option.selected .option-key{color:var(--primary);}
.option.correct .option-key{color:var(--success);}
.option.wrong   .option-key{color:var(--danger);}
.explanation{background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.25);border-radius:6px;padding:.8rem 1rem;margin-top:1rem;font-size:.88rem;color:#c4b5fd;display:none;line-height:1.65;}
.explanation.show{display:block;}
.btn-row{display:flex;gap:.75rem;margin-top:1.5rem;flex-wrap:wrap;}
button{padding:.55rem 1.3rem;border-radius:7px;border:none;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit;transition:filter .15s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-success{background:var(--success);color:#fff;}
.btn-muted{background:#334155;color:var(--text);}
button:hover{filter:brightness(1.1);}
button:disabled{opacity:.45;cursor:not-allowed;}
/* Section badge */
.section-badge{display:inline-block;background:rgba(168,85,247,.15);color:#c4b5fd;border:1px solid rgba(168,85,247,.3);border-radius:999px;padding:.2rem .75rem;font-size:.75rem;font-weight:600;margin-bottom:.75rem;}
/* Results */
#results{display:none;text-align:center;padding:2.5rem 1rem;}
.score-ring{width:140px;height:140px;border-radius:50%;border:6px solid var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto 1.5rem;font-size:2.2rem;font-weight:700;}
.score-ring.great{border-color:var(--success);color:var(--success);}
.score-ring.ok{border-color:var(--warning);color:var(--warning);}
.score-ring.poor{border-color:var(--danger);color:var(--danger);}
.score-msg{font-size:1.1rem;margin-bottom:.5rem;}
.score-sub{color:var(--muted);font-size:.9rem;margin-bottom:2rem;}
.review-list{text-align:left;margin-top:1.5rem;}
.review-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:.75rem;}
.review-item.r-correct{border-left:3px solid var(--success);}
.review-item.r-wrong{border-left:3px solid var(--danger);}
.review-q{font-size:.88rem;margin-bottom:.35rem;}
.review-a{font-size:.85rem;color:var(--muted);}
.review-a .wrong{color:var(--danger);}
.review-a .right{color:var(--success);}
</style>
</head>
<body>
<div class="container">
  <h1>🗂️ Quiz — Lesson 17</h1>
  <p class="subtitle">Basic Data Structures · 12 questions (10 MC + 2 trace) · Select your answer then click Check</p>

  <p class="progress-label" id="prog-label">Question 1 of 12</p>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:8.3%"></div></div>

  <div id="quiz-area"></div>
  <div id="results"></div>
</div>

<script>
const QUESTIONS = [
  {type:'mc',section:'Multiple Choice',
   q:"Which term describes a Stack's ordering behaviour?",
   options:["First-In, First-Out (FIFO)","Last-In, First-Out (LIFO)","Random Access","Priority-based"],
   answer:1,explanation:"A Stack is LIFO — Last-In, First-Out. Think of a stack of plates: you always add and remove from the top. The last plate placed is the first one taken."},
  {type:'mc',section:'Multiple Choice',
   q:"You call push(1), push(2), push(3), then pop() on a Stack. What does pop() return?",
   options:["1","2","3","undefined"],
   answer:2,explanation:"3 was pushed last, so it sits on top. pop() removes and returns the top element — which is 3."},
  {type:'mc',section:'Multiple Choice',
   q:"Which term describes a Queue's ordering behaviour?",
   options:["Last-In, First-Out (LIFO)","First-In, First-Out (FIFO)","Sorted order","Random Access"],
   answer:1,explanation:"A Queue is FIFO — First-In, First-Out. Think of a checkout queue: the first person to join is the first to be served."},
  {type:'mc',section:'Multiple Choice',
   q:"You call enqueue('A'), enqueue('B'), enqueue('C'), then dequeue(). What does dequeue() return?",
   options:["C","B","A","undefined"],
   answer:2,explanation:"'A' was enqueued first. Queue is FIFO, so the first item in is the first item out — dequeue() returns 'A'."},
  {type:'mc',section:'Multiple Choice',
   q:"What is the Big O of push() on a Stack implemented with an array?",
   options:["O(n)","O(n²)","O(log n)","O(1)"],
   answer:3,explanation:"push() adds to the END of the array — no shifting of existing elements is needed. That's a single operation: O(1) — Constant Time."},
  {type:'mc',section:'Multiple Choice',
   q:"In a Linked List, the 'head' refers to:",
   options:["The last node","The middle node","The first node","The node with the highest value"],
   answer:2,explanation:"head always points to the first node in the list. It is your starting point for any traversal."},
  {type:'mc',section:'Multiple Choice',
   q:"What does the next property of the LAST node in a Linked List point to?",
   options:["The first node (circular)","Itself","undefined","null"],
   answer:3,explanation:"null is the 'null terminator' — it signals the end of the list. The while loop condition (current !== null) uses this to know when to stop traversing."},
  {type:'mc',section:'Multiple Choice',
   q:"What is the Big O of accessing the 5th element in a Linked List?",
   options:["O(1)","O(log n)","O(n) — you must traverse from the head","O(n²)"],
   answer:2,explanation:"Unlike arrays, Linked Lists have NO index. To get to the 5th element, you must walk the chain: head → node 2 → node 3 → ... → node 5. That's O(n)."},
  {type:'mc',section:'Multiple Choice',
   q:"You need to process tasks in the order they arrive (e.g., a print queue). Which data structure fits best?",
   options:["Stack","Queue","Linked List with random access","An unsorted array"],
   answer:1,explanation:"FIFO behaviour = Queue. Tasks are processed in the order they were submitted. A Stack would process the most recently submitted task first — wrong for this use case."},
  {type:'mc',section:'Multiple Choice',
   q:"Which is a real-world use case for a Stack?",
   options:["People waiting at a bank","Customer support tickets in order","Your browser's back/forward navigation history","Items on a conveyor belt"],
   answer:2,explanation:"Browser history is LIFO. When you press Back, you go to the most recently visited page — the last one pushed onto the history stack."},
  {type:'trace',section:'Trace Exercise',
   q:"Trace the Stack. What are the Stack state and return values after each operation? (FRONT = left, TOP = right)",
   traceOps:[
     {op:"push(10)",  stateAns:"[ 10 ]",       retAns:"—"},
     {op:"push(20)",  stateAns:"[ 10, 20 ]",   retAns:"—"},
     {op:"push(30)",  stateAns:"[ 10, 20, 30 ]",retAns:"—"},
     {op:"pop()",     stateAns:"[ 10, 20 ]",   retAns:"30"},
     {op:"push(40)",  stateAns:"[ 10, 20, 40 ]",retAns:"—"},
     {op:"peek()",    stateAns:"[ 10, 20, 40 ]",retAns:"40"},
   ],
   explanation:"pop() removed 30 (the top). peek() does NOT change the stack — it just returns the top (40) without removing it."},
  {type:'trace',section:'Trace Exercise',
   q:"Trace the Queue (FRONT → BACK). What are the Queue state and return values after each operation?",
   traceOps:[
     {op:"enqueue('Alice')",   stateAns:"[ Alice ]",                  retAns:"—"},
     {op:"enqueue('Bob')",     stateAns:"[ Alice, Bob ]",              retAns:"—"},
     {op:"enqueue('Charlie')", stateAns:"[ Alice, Bob, Charlie ]",     retAns:"—"},
     {op:"dequeue()",          stateAns:"[ Bob, Charlie ]",            retAns:"'Alice'"},
     {op:"enqueue('Dave')",    stateAns:"[ Bob, Charlie, Dave ]",      retAns:"—"},
     {op:"dequeue()",          stateAns:"[ Charlie, Dave ]",           retAns:"'Bob'"},
   ],
   explanation:"dequeue() removes from the FRONT (FIFO). Alice was first in, so she's first out. Bob was next, so he's the second to be dequeued."},
];

let current=0, score=0, selected=[], checked=[], traceState=[];

function buildQuiz(){
  const area=document.getElementById('quiz-area');
  area.innerHTML='';
  QUESTIONS.forEach((q,i)=>{
    const card=document.createElement('div');
    card.className='question-card'+(i===0?' active':'');
    card.id='q'+i;
    let inner='';
    inner+=`<div class="section-badge">${q.section}</div>`;
    inner+=`<div class="q-number">Question ${i+1} of ${QUESTIONS.length}</div>`;
    inner+=`<div class="q-text">${q.q}</div>`;
    if(q.type==='mc'){
      inner+=`<div class="options">${q.options.map((o,oi)=>`<div class="option" id="opt-${i}-${oi}" onclick="selectOpt(${i},${oi})"><span class="option-key">${'ABCD'[oi]}</span><span>${o}</span></div>`).join('')}</div>`;
    } else {
      // Trace
      inner+=`<div class="trace-box">`;
      inner+=`<table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <tr style="color:#475569;border-bottom:1px solid #334155;"><th style="text-align:left;padding:.4rem .5rem">Operation</th><th style="padding:.4rem">State after (→ = next)</th><th style="padding:.4rem">Return</th></tr>`;
      q.traceOps.forEach((row,ri)=>{
        inner+=`<tr style="border-bottom:1px solid #1e293b;">
          <td style="padding:.5rem;color:#93c5fd;font-weight:600">${row.op}</td>
          <td style="padding:.5rem;text-align:center"><input class="trace-input" id="ti-${i}-${ri}-0" placeholder="?" /></td>
          <td style="padding:.5rem;text-align:center"><input class="trace-input" id="ti-${i}-${ri}-1" placeholder="?" style="width:90px" /></td>
        </tr>`;
      });
      inner+=`</table></div>`;
    }
    inner+=`<div class="explanation" id="exp-${i}">${q.explanation}</div>`;
    inner+=`<div class="btn-row">
      <button class="btn-primary" id="check-${i}" onclick="checkAnswer(${i})" ${q.type==='mc'?'disabled':''}>Check Answer</button>
      ${i<QUESTIONS.length-1
        ?`<button class="btn-muted" id="next-${i}" onclick="nextQ(${i})" style="display:none">Next →</button>`
        :`<button class="btn-success" id="next-${i}" onclick="showResults()" style="display:none">See Results 🎉</button>`}
    </div>`;
    card.innerHTML=inner;
    area.appendChild(card);
  });
}

function selectOpt(qi,oi){
  if(checked[qi])return;
  selected[qi]=oi;
  document.querySelectorAll(`[id^="opt-${qi}-"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
  document.getElementById(`check-${qi}`).disabled=false;
}

function checkAnswer(qi){
  if(checked[qi])return;
  checked[qi]=true;
  const q=QUESTIONS[qi];
  if(q.type==='mc'){
    const correct=q.answer, userAns=selected[qi];
    if(userAns===correct) score++;
    document.querySelectorAll(`[id^="opt-${qi}-"]`).forEach((el,oi)=>{
      el.style.pointerEvents='none';
      if(oi===correct) el.classList.add('correct');
      if(oi===userAns&&userAns!==correct) el.classList.add('wrong');
    });
  } else {
    // Trace: check inputs
    let allCorrect=true;
    q.traceOps.forEach((row,ri)=>{
      const inp0=document.getElementById(`ti-${qi}-${ri}-0`);
      const inp1=document.getElementById(`ti-${qi}-${ri}-1`);
      [inp0,inp1].forEach(inp=>inp.disabled=true);
      const ok0=inp0.value.trim().replace(/\s+/g,'')===row.stateAns.replace(/\s+/g,'');
      const ok1=inp1.value.trim().replace(/\s+/g,'')===row.retAns.replace(/\s+/g,'');
      inp0.classList.add(ok0?'correct-input':'wrong-input');
      inp1.classList.add(ok1?'correct-input':'wrong-input');
      if(!ok0||!ok1) allCorrect=false;
    });
    if(allCorrect) score++;
    selected[qi]=allCorrect?1:0; // 1=correct, 0=wrong for review
  }
  document.getElementById(`exp-${qi}`).classList.add('show');
  document.getElementById(`check-${qi}`).style.display='none';
  document.getElementById(`next-${qi}`).style.display='inline-block';
}

function nextQ(qi){
  document.getElementById('q'+qi).classList.remove('active');
  current=qi+1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const pct=((current+1)/QUESTIONS.length)*100;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-label').textContent=`Question ${current+1} of ${QUESTIONS.length}`;
}

function showResults(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('prog-fill').style.width='100%';
  document.getElementById('prog-label').textContent='Complete!';
  const pct=Math.round((score/QUESTIONS.length)*100);
  const cls=pct>=80?'great':pct>=50?'ok':'poor';
  const msgs={great:'Outstanding! 🎉',ok:'Good effort — review what you missed.',poor:'Keep at it — revisit the lesson.'};
  const items=QUESTIONS.map((q,i)=>{
    const ok=q.type==='mc'?selected[i]===q.answer:selected[i]===1;
    const yourA=q.type==='mc'&&selected[i]!==undefined?`${' ABCD'[selected[i]+1]||'?'}) ${q.options[selected[i]]||'Not answered'}`:'(trace exercise)';
    const correctA=q.type==='mc'?`${'ABCD'[q.answer]}) ${q.options[q.answer]}`:'See answers revealed in the inputs above';
    return `<div class="review-item ${ok?'r-correct':'r-wrong'}">
      <div class="review-q">${i+1}. ${q.q.substring(0,80)}${q.q.length>80?'...':''}</div>
      <div class="review-a">
        ${q.type==='mc'?`Your answer: <span class="${ok?'right':'wrong'}">${yourA}</span><br>${!ok?`Correct: <span class="right">${correctA}</span>`:''}`:
        `<span class="${ok?'right':'wrong'}">${ok?'✅ All trace values correct':'❌ Some trace values were incorrect — see highlights above'}</span>`}
      </div></div>`;
  }).join('');
  document.getElementById('results').innerHTML=`
    <div class="score-ring ${cls}"><span>${score}/${QUESTIONS.length}</span><span style="font-size:.9rem;margin-top:.1rem">${pct}%</span></div>
    <div class="score-msg">${msgs[cls]}</div>
    <div class="score-sub">Lesson 17 — Basic Data Structures</div>
    <button class="btn-primary" onclick="restartQuiz()">↩ Retake Quiz</button>
    <div class="review-list">${items}</div>`;
  document.getElementById('results').style.display='block';
}

function restartQuiz(){
  current=0;score=0;selected=[];checked=[];traceState=[];
  document.getElementById('results').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  updateProgress();buildQuiz();
}

buildQuiz();
</script>
</body>
</html>
