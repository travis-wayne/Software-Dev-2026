# =========================================================================
# Lesson 44 Template: GitHub Actions CI/CD Pipeline for GitHub Container Registry
# =========================================================================
# Instructions:
# To use this in your live GitHub repository, copy this file to:
# .github/workflows/ghcr-publish.yml
# ZERO SECRET SETUP REQUIRED! Uses automatic ${{ secrets.GITHUB_TOKEN }}!
# =========================================================================

name: CI/CD Pipeline - GHCR Publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-ghcr:
    name: Build & Publish to GitHub Container Registry
    runs-on: ubuntu-latest
    
    # MANDATORY: Grant write permissions to GITHUB_TOKEN for container publishing!
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Checkout repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Zero-config authentication using automatic GITHUB_TOKEN
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Generate automated metadata tags (:latest and commit SHA)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Step 5: Build and push container image with GHA layer caching
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./Lesson 44/examples/github-actions-docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            REGISTRY_TAG=ghcr-automated
          cache-from: type=gha
          cache-to: type=gha,mode=max
