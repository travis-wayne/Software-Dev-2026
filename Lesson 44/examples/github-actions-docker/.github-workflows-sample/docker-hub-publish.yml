# =========================================================================
# Lesson 44 Template: GitHub Actions CI/CD Pipeline for Docker Hub
# =========================================================================
# Instructions:
# To use this in your live GitHub repository, copy this file to:
# .github/workflows/docker-hub-publish.yml
# Then configure two repository secrets in GitHub -> Settings -> Secrets:
# 1. DOCKERHUB_USERNAME: Your Docker Hub account username
# 2. DOCKERHUB_TOKEN   : A Personal Access Token (PAT) generated in Docker Hub
# =========================================================================

name: CI/CD Pipeline - Docker Hub Publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build & Publish Container to Docker Hub
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (Enables layer caching & multi-arch builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Securely authenticate with Docker Hub (Skipped on pull requests)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Extract metadata tags (:latest and Git commit SHA for GitOps rollback)
      - name: Extract Docker metadata tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/express-api-service
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Step 5: Build and push container image with injected Git SHA arguments
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Lesson 44/examples/github-actions-docker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ env.GITHUB_RUN_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
