# =========================================================================
# Lesson 44: Kubernetes Ingress Controller Routing
# Routes external HTTPS domain traffic to internal ClusterIP services
# =========================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: express-api-ingress
  labels:
    app: express-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.softwaredev2026.com
      secretName: api-tls-cert     # Auto-generated SSL certificate by cert-manager
  rules:
    - host: api.softwaredev2026.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: express-api-internal
                port:
                  number: 3007
