# =========================================================================
# Lesson 44: Kubernetes ConfigMap & Secret
# Decouples environment variables and sensitive credentials from container images
# =========================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: express-api-config
  labels:
    app: express-api
    tier: backend
data:
  NODE_ENV: "production"
  PORT: "3007"
  SERVICE_NAME: "kubernetes-production-cluster-api"
  APP_VERSION: "2.4.0-k8s"

---
apiVersion: v1
kind: Secret
metadata:
  name: express-api-secrets
  labels:
    app: express-api
type: Opaque
# Note: In production K8s, Secret values must be Base64 encoded!
# echo -n "postgres://admin:SecretPass@db.internal:5432/prod" | base64
data:
  DATABASE_URL: "cG9zdGdyZXM6Ly9hZG1pbjpTZWNyZXRQYXNzQGRiLmludGVybmFsOjU0MzIvcHJvZA=="
  JWT_SECRET: "c3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLWt1YmVybmV0ZXM="
