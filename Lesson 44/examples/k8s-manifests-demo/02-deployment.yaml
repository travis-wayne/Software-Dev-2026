# =========================================================================
# Lesson 44: Kubernetes Deployment
# Manages replica pods, self-healing restarts, and zero-downtime rolling updates
# =========================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-api-deployment
  labels:
    app: express-api
    tier: backend
spec:
  replicas: 3                    # Maintain exactly 3 identical Pod copies across worker nodes
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                # Allow 1 extra Pod during updates
      maxUnavailable: 0          # Zero downtime: Never terminate an old Pod until new Pod is healthy!
  selector:
    matchLabels:
      app: express-api
  template:
    metadata:
      labels:
        app: express-api
        tier: backend
    spec:
      containers:
        - name: express-api-container
          # Pull immutable image generated by our GitHub Actions CI/CD pipeline
          image: ghcr.io/software-dev/express-api-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3007
              name: http-api
          # Inject ConfigMap & Secret as environment variables
          envFrom:
            - configMapRef:
                name: express-api-config
            - secretRef:
                name: express-api-secrets
          # Resource constraints to prevent CPU/Memory starvation
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # Automated Readiness Probe: Route traffic ONLY when Express is ready
          readinessProbe:
            httpGet:
              path: /api/telemetry
              port: 3007
            initialDelaySeconds: 3
            periodSeconds: 5
          # Automated Liveness Probe: Kubelet reboots Pod if this returns error!
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3007
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
